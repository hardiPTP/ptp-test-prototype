*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#F2EADF;color:var(--ink);font-family:var(--text);font-weight:300}

.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:8px;pointer-events:none}

.chips{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;z-index:2}
.pill{border:0;border-radius:22px;height:44px;padding:0 16px;background:rgba(251,248,244,.96);box-shadow:0 6px 18px rgba(23,20,15,.10);font:400 13.5px var(--text);color:var(--ink);cursor:pointer}
.pill.on{background:var(--ink);color:var(--canvas)}
#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:#fff;border-radius:22px;padding:16px 16px 14px;box-shadow:0 14px 34px rgba(23,20,15,.16);transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:3;max-width:460px;margin:0 auto}
#card.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#card .k{display:flex;align-items:center;gap:8px;font:400 12px var(--text);color:var(--ink60);margin-bottom:6px}
#card .k i{width:10px;height:10px;border-radius:50%;display:inline-block}
#card h3{font:400 17px/22px var(--head);margin:0 0 6px}
#card p{font:300 13px/18px var(--text);color:var(--ink60);margin:0 0 10px}
#card .meta{font:300 12.5px/16px var(--text);color:var(--ink60)}
#card a{color:var(--ink);text-underline-offset:3px}
#card .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--well);font:400 18px/1 var(--text);color:var(--ink60);cursor:pointer}
.attr{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 4px);font:300 9.5px var(--text);color:var(--ink45);z-index:1}
.attr a{color:inherit}
#load{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 86px);transform:translateX(-50%);background:rgba(23,20,15,.82);color:#fff;font:400 12px var(--text);padding:7px 12px;border-radius:14px;transition:opacity .3s;pointer-events:none}
#hint{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(23,20,15,.78);color:#fff;font:400 13px/18px var(--text);padding:10px 14px;border-radius:16px;text-align:center;transition:opacity .5s;pointer-events:none}
</style>

  for (const lb of labels) {
    const el = document.createElement('div'); el.className = 'lbl ' + lb.cls; el.textContent = lb.name;
    const o = new CSS2DObject(el); o.position.set(lb.x, lb.cls ? 30 : 12, lb.z); o.userData = { kind: lb.cls ? 'area' : 'road' }; group.add(o);
  }
  return group;
}

const TREE = {
  canopy: new THREE.IcosahedronGeometry(5.5, 1).translate(0, 9, 0),
  trunk: new THREE.CylinderGeometry(0.7, 0.9, 5, 6).translate(0, 2.5, 0),
};

/* ---------- tile manager ---------- */
const tiles = new Map(); const queue = []; let inflight = 0;
const loadEl = document.getElementById('load');
function want(z, x, y, detail) {
  const key = z + '/' + x + '/' + y; if (tiles.has(key)) return tiles.get(key);
  const t = { key, z, x, y, detail, state: 'queued', group: null }; tiles.set(key, t); queue.push(t); return t;
}
async function pump() {
  while (inflight < 4 && queue.length) {
    queue.sort((a, b) => a.prio - b.prio); const t = queue.shift(); if (t.state !== 'queued') continue;
    inflight++; t.state = 'loading';
    getTile(t.z, t.x, t.y).then((vt) => { t.vt = vt; t.state = 'build'; buildQ.push(t); }).catch(() => { t.state = 'error'; }).finally(() => { inflight--; pump(); });
  }
  loadEl.style.opacity = (queue.length || inflight || buildQ.length) ? 1 : 0;
}
const buildQ = [];
function buildOne() {
  const t = buildQ.shift(); if (!t) return; if (t.state !== 'build') return;
  t.group = buildTile(t.vt, t.z, t.x, t.y, t.detail); t.vt = null; t.state = 'ready'; scene.add(t.group); dirtyLabels = true;
}
function drop(t) {
  if (t.group) { t.group.traverse((o) => { if (o.geometry && o.geometry !== TREE.canopy && o.geometry !== TREE.trunk) o.geometry.dispose(); if (o.isCSS2DObject) o.element.remove(); }); scene.remove(t.group); }
  t.state = 'dropped'; tiles.delete(t.key);
}

// overview: whole Mumbai at z12 (water, green, major roads, area names)
const BBOX = [72.76, 18.88, 73.02, 19.32];
(function overview() {
  const [x0, y0] = tileXY(BBOX[0], BBOX[3], 12), [x1, y1] = tileXY(BBOX[2], BBOX[1], 12);
  for (let x = Math.floor(x0); x <= Math.floor(x1); x++) for (let y = Math.floor(y0); y <= Math.floor(y1); y++) { const t = want(12, x, y, false); t.prio = -1; }
})();

let lastDetailKey = '';
function updateDetail() {
  const d = camera.position.distanceTo(controls.target);
  const [lon, lat] = toLL(controls.target.x, controls.target.z);
  const keep = new Set();
  if (d < 3800) {
    const [fx, fy] = tileXY(lon, lat, 14); const cx = Math.floor(fx), cy = Math.floor(fy);
    const rad = d < 1500 ? 2 : 3;
    for (let dx = -rad; dx <= rad; dx++) for (let dy = -rad; dy <= rad; dy++) {
      if (Math.hypot(dx, dy) > rad + 0.5) continue;
      const t = want(14, cx + dx, cy + dy, true); t.prio = Math.hypot(cx + dx + 0.5 - fx, cy + dy + 0.5 - fy); keep.add(t.key);
    }
  }
  for (const t of [...tiles.values()]) if (t.detail && !keep.has(t.key)) {
    const [fx, fy] = tileXY(lon, lat, 14); if (d > 5000 || Math.hypot(t.x + 0.5 - fx, t.y + 0.5 - fy) > 6) { if (t.state === 'queued') t.state = 'dropped', tiles.delete(t.key); else if (t.state === 'ready') drop(t); }
  }
  pump();
}

/* ---------- pins (thumbtack: kind-coloured head, white cap, needle) ---------- */
const pinGroup = new THREE.Group(); scene.add(pinGroup);
const PIN = { needle: new THREE.CylinderGeometry(0.5, 0.08, 16, 8).translate(0, 8, 0), head: new THREE.SphereGeometry(6.5, 24, 16).translate(0, 22, 0), cap: new THREE.CylinderGeometry(3.6, 3.6, 1.2, 24).translate(0, 28.2, 0), shadow: new THREE.CircleGeometry(4.5, 20).rotateX(-Math.PI / 2).translate(0, 0.5, 0) };
const needleMat = new THREE.MeshStandardMaterial({ color: 0x6E6862, roughness: 0.4, metalness: 0.4 });
const capMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x17140F, transparent: true, opacity: 0.18, depthWrite: false });
const headMats = {}; for (const [k, c] of Object.entries(KIND)) headMats[k] = new THREE.MeshStandardMaterial({ color: new THREE.Color(c), roughness: 0.45 });
const pins = [];
ITEMS.forEach((it, i) => {
  const g = new THREE.Group(); const [x, z] = ll(it.lng, it.lat);
  const head = new THREE.Mesh(PIN.head, headMats[it.k]); head.castShadow = true;
  g.add(new THREE.Mesh(PIN.needle, needleMat), head, new THREE.Mesh(PIN.cap, capMat), new THREE.Mesh(PIN.shadow, shadowMat));
  g.position.set(x, 0, z); g.userData = { i }; g.renderOrder = 30; pinGroup.add(g); pins.push(g);
});

/* ---------- card ---------- */
const card = document.getElementById('card');
card.querySelector('.x').onclick = () => { card.classList.remove('on'); sel = -1; };
let sel = -1;
function showCard(i) {
  const it = ITEMS[i]; sel = i;
  card.querySelector('.k i').style.background = KIND[it.k];
  card.querySelector('.k span').textContent = KNAME[it.k] + (it.when ? ', ' + it.when : '');
  card.querySelector('h3').textContent = it.t;
  card.querySelector('p').textContent = it.b || '';
  const meta = card.querySelector('.meta'); meta.innerHTML = '';
  const place = [it.place, it.loc].filter(Boolean).join(', ') + (it.approx ? '. Location approximate' : '');
  meta.append(document.createTextNode(place));
  if (it.url) { meta.append(document.createElement('br')); const a = document.createElement('a'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Source: ' + (it.src || 'link'); meta.append(a); }
  card.classList.add('on');
}
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2(); let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY, performance.now()]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6 || performance.now() - downAt[2] > 400) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  // screen-space pick: nearest pin head within 28 px
  let best = -1, bd = 28 * 28; const v = new THREE.Vector3();
  pins.forEach((p, i) => { v.set(0, 22, 0).multiplyScalar(p.scale.x).add(p.position).project(camera); if (v.z > 1) return; const sx = (v.x + 1) / 2 * innerWidth, sy = (1 - v.y) / 2 * innerHeight; const dd = (sx - e.clientX) ** 2 + (sy - e.clientY) ** 2; if (dd < bd) { bd = dd; best = i; } });
  if (best >= 0) { showCard(best); flyTo(pins[best].position.x, pins[best].position.z, Math.min(camera.position.distanceTo(controls.target), 900)); }
  else card.classList.remove('on');
});

/* ---------- camera moves ---------- */
let fly = null;
function flyTo(x, z, dist, polar = 52, az = null, ms = 1100) {
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  fly = { t0: performance.now(), ms, from: { tx: controls.target.x, tz: controls.target.z, r: sph.radius, ph: sph.phi, th: sph.theta }, to: { tx: x, tz: z, r: dist, ph: THREE.MathUtils.degToRad(polar), th: az == null ? sph.theta : az } };
}
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function stepFly(now) {
  if (!fly) return; const t = Math.min(1, (now - fly.t0) / fly.ms), e = ease(t), f = fly.from, g = fly.to;
  const lerp = (a, b) => a + (b - a) * e; const r = Math.exp(lerp(Math.log(f.r), Math.log(g.r)));
  controls.target.set(lerp(f.tx, g.tx), 0, lerp(f.tz, g.tz));
  const s = new THREE.Spherical(r, lerp(f.ph, g.ph), lerp(f.th, g.th)); camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
  if (t >= 1) fly = null;
}
const PLACES = { bandra: [72.8296, 19.0559, 1700, 'Bandra West'], south: [72.8277, 18.9300, 2600, 'South Bombay'], all: [72.875, 19.08, 42000, 'Mumbai'] };
document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => {
  document.querySelectorAll('[data-go]').forEach((x) => x.classList.toggle('on', x === b));
  const [lon, lat, d, name] = PLACES[b.dataset.go]; const [x, z] = ll(lon, lat); flyTo(x, z, d, b.dataset.go === 'all' ? 20 : 52, b.dataset.go === 'all' ? 0 : null); document.getElementById('mt').textContent = name;
});
let flat2d = false;
document.getElementById('tilt').onclick = () => { flat2d = !flat2d; document.getElementById('tiltl').textContent = flat2d ? '3D' : '2D'; flyTo(controls.target.x, controls.target.z, camera.position.distanceTo(controls.target), flat2d ? 0.1 : 52, null, 700); };
document.getElementById('north').onclick = () => flyTo(controls.target.x, controls.target.z, camera.position.distanceTo(controls.target), THREE.MathUtils.radToDeg(new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)).phi), 0, 700);

/* ---------- labels: declutter by screen distance ---------- */
let dirtyLabels = true, lastLabelT = 0;
function declutter() {
  const d = camera.position.distanceTo(controls.target); const placed = []; const v = new THREE.Vector3();
  const objs = []; scene.traverse((o) => { if (o.isCSS2DObject) objs.push(o); });
  objs.sort((a, b) => (a.userData.kind === 'area' ? 0 : 1) - (b.userData.kind === 'area' ? 0 : 1));
  for (const o of objs) {
    let ok = o.userData.kind === 'area' ? true : d < 1800;
    if (ok) { v.copy(o.position).project(camera); if (v.z > 1 || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1) ok = false; else { const sx = v.x * innerWidth / 2, sy = v.y * innerHeight / 2; for (const p of placed) if (Math.abs(p[0] - sx) < 110 && Math.abs(p[1] - sy) < 28) { ok = false; break; } if (ok) placed.push([sx, sy]); } }
    o.visible = ok;
  }
}

/* ---------- loop ---------- */
const [bx, bz] = ll(...PLACES.bandra.slice(0, 2));
controls.target.set(bx, 0, bz);
camera.position.set(bx + 600, 1250, bz + 1100);
controls.update();
let lastUpd = 0;
function frame(now) {
  stepFly(now); controls.update();
  const d = camera.position.distanceTo(controls.target);
  scene.fog.near = d * 1.6; scene.fog.far = d * 5 + 2000;
  camera.near = Math.max(2, d / 200); camera.far = d * 20 + 5000; camera.updateProjectionMatrix();
  // sun follows the view so shadows stay crisp where you look
  const T = controls.target; sun.position.set(T.x - 700, 1400, T.z + 500); sun.target.position.copy(T); sun.target.updateMatrixWorld();
  sun.castShadow = d < 3500;
  // pins keep a readable size at any zoom
  const s = THREE.MathUtils.clamp(d / 1100, 0.6, 60);
  for (const p of pins) p.scale.setScalar(s);
  if (now - lastUpd > 250) { lastUpd = now; updateDetail(); }
  buildOne(); if (buildQ.length > 6) buildOne();
  renderer.render(scene, camera);
  if (dirtyLabels || now - lastLabelT > 200) { declutter(); dirtyLabels = false; lastLabelT = now; }
  labelR.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });
pump(); requestAnimationFrame(frame);
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 3500);
window.__ptp = { tiles, ITEMS, flyTo, ll, controls, camera };
</script>
